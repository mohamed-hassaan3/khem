# KHEM — Umami dashboard (TLS). Runbook: src/docs/umami-analytics.md
#
#   https://analytics.khemperfumes.com   → Umami on 127.0.0.1:3001 (docker)
#   http://analytics.khemperfumes.com    → 301 to HTTPS (ACME excepted)
#
# Install only once its certificate exists: this file names it, and `nginx -t`
# fails on a missing one. The first certificate is issued over the ACME
# location in khemperfumes.conf's port-80 `default_server`, which answers for
# any host — so no bootstrap variant of this file is needed.
#
# The storefront never sends visitors here: the tracker is served first-party
# from khemperfumes.com/hk.js. This host exists for the people who log in.
#
# Login policy (named accounts, 2FA for everyone, default `admin` deleted) is in
# the runbook. nginx adds the two things Umami cannot do itself: a brute-force
# limit on the login endpoint and keeping the host out of search indexes.

# Five login attempts a minute per address (burst 5), then 429. Ten guesses
# before slowing down is generous for a person and useless for a script.
# Top-level in this file = http context, which is where nginx requires it.
limit_req_zone $binary_remote_addr zone=umami_login:1m rate=5r/m;

# Its own name: sites-enabled loads alphabetically, so this file is read before
# khemperfumes.conf and cannot use the `khem_noquery` format defined there.
log_format umami_noquery '$remote_addr - [$time_local] "$request_method $uri $server_protocol" '
                         '$status $body_bytes_sent $request_time "$http_user_agent"';

# ── HTTP: ACME challenge, everything else to HTTPS ───────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name analytics.khemperfumes.com;

    access_log /var/log/nginx/umami.access.log umami_noquery;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://analytics.khemperfumes.com$request_uri;
    }
}

# ── HTTPS: the dashboard ─────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name analytics.khemperfumes.com;

    ssl_certificate     /etc/letsencrypt/live/analytics.khemperfumes.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/analytics.khemperfumes.com/privkey.pem;
    include /etc/nginx/snippets/khem-tls.inc;

    access_log /var/log/nginx/umami.access.log umami_noquery;
    client_max_body_size 1m;

    location = /api/auth/login {
        limit_req zone=umami_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3001;
        include /etc/nginx/snippets/khem-umami-proxy.inc;
        include /etc/nginx/snippets/khem-hsts.inc;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # The second factor is a separate request (Umami 3.5: POST /api/2fa/verify).
    # Umami rate-limits codes itself too; this caps it before it reaches Node.
    location = /api/2fa/verify {
        limit_req zone=umami_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3001;
        include /etc/nginx/snippets/khem-umami-proxy.inc;
        include /etc/nginx/snippets/khem-hsts.inc;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        include /etc/nginx/snippets/khem-umami-proxy.inc;
        include /etc/nginx/snippets/khem-hsts.inc;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
}
