# KHEM — production site (TLS). Installed once the certificate exists.
#
#   https://khemperfumes.com          → Next.js on 127.0.0.1:3000
#   https://www.khemperfumes.com      → 301 to the apex
#   http://*                          → 301 to https://khemperfumes.com (ACME excepted)
#
# Ubuntu 24.04 ships nginx 1.24, so HTTP/2 is the `listen … http2` form
# (the standalone `http2 on;` directive needs 1.25.1).

upstream khem_next {
    server 127.0.0.1:3000;
    keepalive 16;
}

log_format khem_noquery '$remote_addr - [$time_local] "$request_method $uri $server_protocol" '
                        '$status $body_bytes_sent $request_time "$http_user_agent"';

# ── HTTP: ACME challenge, everything else to HTTPS apex ─────────────────────
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name khemperfumes.com www.khemperfumes.com _;

    access_log /var/log/nginx/khem.access.log khem_noquery;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://khemperfumes.com$request_uri;
    }
}

# ── HTTPS www → apex ─────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.khemperfumes.com;

    ssl_certificate     /etc/letsencrypt/live/khemperfumes.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/khemperfumes.com/privkey.pem;
    include /etc/nginx/snippets/khem-tls.inc;

    access_log /var/log/nginx/khem.access.log khem_noquery;
    return 301 https://khemperfumes.com$request_uri;
}

# ── HTTPS apex: the site ─────────────────────────────────────────────────────
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name khemperfumes.com;

    ssl_certificate     /etc/letsencrypt/live/khemperfumes.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/khemperfumes.com/privkey.pem;
    include /etc/nginx/snippets/khem-tls.inc;

    access_log /var/log/nginx/khem.access.log khem_noquery;

    # Comment photos: up to the bucket's 5 MB each, several per comment.
    client_max_body_size 25m;

    # Build output is content-hashed, so it can be cached forever. Next sets the
    # same header itself; stating it here keeps it if that ever changes. Next's
    # copy is hidden first — `add_header` appends, and two Cache-Control headers
    # were being sent.
    location /_next/static/ {
        include /etc/nginx/snippets/khem-proxy.inc;
        include /etc/nginx/snippets/khem-hsts.inc;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # ── Umami, first-party (src/docs/umami-analytics.md) ─────────────────────
    # The tracker and its collect endpoint, served from this origin so the CSP
    # stays 'self' and ad blockers do not drop the data. Exact matches: they
    # win before `location /`, so Next (and src/proxy.ts) never sees either
    # path. Both are mapped onto Umami's own paths here rather than through
    # Umami's build-time rewrites, which a prebuilt image does not pick up.
    #
    # Neither is a page — the script loads on every storefront page; it is
    # cookieless and not consent-gated (src/components/analytics/UmamiAnalytics.tsx).
    location = /hk.js {
        include /etc/nginx/snippets/khem-umami-proxy.inc;
        include /etc/nginx/snippets/khem-hsts.inc;
        proxy_pass http://127.0.0.1:3001/script.js;
        # An hour, so a tracker upgrade reaches browsers the same day.
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=3600" always;
    }

    location = /api/hk {
        include /etc/nginx/snippets/khem-umami-proxy.inc;
        include /etc/nginx/snippets/khem-hsts.inc;
        proxy_pass http://127.0.0.1:3001/api/send;
        # One event is a few hundred bytes.
        client_max_body_size 64k;
    }

    location / {
        include /etc/nginx/snippets/khem-proxy.inc;
        include /etc/nginx/snippets/khem-hsts.inc;
    }
}
