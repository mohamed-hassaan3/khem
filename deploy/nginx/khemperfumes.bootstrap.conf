# KHEM — HTTP-only bootstrap.
#
# Used from provisioning until the Let's Encrypt certificate exists: it serves
# the ACME challenge and proxies the app over plain HTTP so the deploy can be
# smoke-tested by IP. Replaced by khemperfumes.conf once TLS is issued
# (src/docs/hostinger-vps.md, "TLS").

upstream khem_next {
    server 127.0.0.1:3000;
    keepalive 16;
}

# Query strings are left out of the access log: they carry unsubscribe tokens
# and search terms, and neither belongs in a log file.
log_format khem_noquery '$remote_addr - [$time_local] "$request_method $uri $server_protocol" '
                        '$status $body_bytes_sent $request_time "$http_user_agent"';

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name khemperfumes.com www.khemperfumes.com _;

    access_log /var/log/nginx/khem.access.log khem_noquery;
    client_max_body_size 25m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        include /etc/nginx/snippets/khem-proxy.inc;
    }
}
